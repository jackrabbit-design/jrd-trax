name: Release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0). Leave blank to use the run number."
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Secrets.swift
        env:
          KANTATA_CLIENT_SECRET: ${{ secrets.KANTATA_CLIENT_SECRET }}
        run: |
          if [ -z "$KANTATA_CLIENT_SECRET" ]; then
            echo "::error::KANTATA_CLIENT_SECRET repository secret is not set"
            exit 1
          fi
          printf 'enum Secrets {\n    static let kantataClientSecret = "%s"\n}\n' "$KANTATA_CLIENT_SECRET" > TraxApp/Sources/TraxApp/Secrets.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project Trax.xcodeproj \
            -scheme Trax \
            -configuration Release \
            -archivePath build/Trax.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Zip the app
        run: |
          ditto -c -k --keepParent --sequesterRsrc \
            build/Trax.xcarchive/Products/Applications/Trax.app Trax.zip

      - name: Determine tag
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            {
              echo "value<<TAG_EOF"
              echo "$TAG_INPUT"
              echo "TAG_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "value=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.2.1
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Trax ${{ steps.tag.outputs.value }}
          body: |
            Unsigned build for internal team use.

            On first launch, macOS will show an "unidentified developer" warning.
            Right-click (or Control-click) `Trax.app` and choose **Open** to bypass it.
          files: Trax.zip
